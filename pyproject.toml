[project]
name = "py-sqlfmt"
version = "0.1.0"
description = "基于官方 sqlparse 的 SQL 格式化外挂层（Doris/SelectDB 优先）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["sqlparse>=0.6,<0.7"]

[tool.pytest.ini_options]
# 默认只跑主套件（fixture 基线回归 + 收敛 + 幂等）；新实现的迁移期门禁在
# `tests_migration/`，用 `pytest tests_migration/` 显式运行。
# 删掉 vendored fork 后两套件已可同会话混跑（只剩一个 sqlparse）。
testpaths = ["tests"]
